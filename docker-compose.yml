# Runs the app together with its own PostgreSQL database.
#   docker compose up --build    build the app image and start both (Ctrl+C to stop)
#   docker compose down          remove the containers (database data is kept)
#   docker compose down -v       remove the containers AND the database data
#
# The password comes from the POSTGRES_PASSWORD environment variable.
# The default below is for local development only - never use it anywhere real.

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_local_dev}
    # Reachable from your Mac on 5433 (5432 is already used by the Homebrew PostgreSQL)
    ports:
      - "5433:5432"
    # Keep the database files in a Docker volume, so data survives restarts
    volumes:
      - shop-db-data:/var/lib/postgresql/data
    # "Ready" = PostgreSQL accepts connections; the app waits for this before starting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: shop-api
    depends_on:
      db:
        condition: service_healthy
    # These override the matching settings in application.properties
    # ("db" is the name of the database container above)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shop
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shop_local_dev}
      # "kafka:29092" is Kafka's address for other containers
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    # Log files written inside the container appear in ./logs on your Mac
    volumes:
      - ./logs:/app/logs

  # Message broker for order events (single server, KRaft mode = no ZooKeeper needed).
  # The app does NOT wait for Kafka: orders still work while it is down (events wait in the outbox table).
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      # This one server is both the broker (stores messages) and the controller (manages the cluster)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two addresses: "kafka:29092" for other containers, "localhost:9092" for programs on your Mac
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Only one server, so Kafka's internal topics can keep just 1 copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created on purpose by the app, not by accident from a typo
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    # Keep messages in a Docker volume, so they survive restarts
    volumes:
      - shop-kafka-data:/var/lib/kafka/data
    # "Ready" = Kafka answers requests
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  shop-db-data:
  shop-kafka-data:
