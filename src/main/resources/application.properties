spring.application.name=shop-api

# Settings shared by every environment live in this file.
# What differs per environment (dev, staging, prod) is in application-<profile>.properties.
# No profile chosen at startup -> use "dev" (your Mac), so ./mvnw spring-boot:run works as before
spring.profiles.default=dev

# Database connection pool (HikariCP) - reuses open connections instead of opening one per request
spring.datasource.hikari.pool-name=ShopHikariPool
# Most connections open at the same time
spring.datasource.hikari.maximum-pool-size=10
# Connections kept ready even when the app is quiet
spring.datasource.hikari.minimum-idle=5
# Wait at most 5 seconds for a free connection, then fail with an error (in milliseconds)
spring.datasource.hikari.connection-timeout=5000
# Close extra idle connections after 5 minutes (in milliseconds)
spring.datasource.hikari.idle-timeout=300000
# Replace each connection after 30 minutes, so none get stale (in milliseconds)
spring.datasource.hikari.max-lifetime=1800000

# Bounded concurrency (Resilience4j Bulkhead) - shared by all controllers using @Bulkhead(name = "api")
# Most requests handled at the same time
resilience4j.bulkhead.instances.api.max-concurrent-calls=20
# How long an extra request waits for a free slot before getting 503
resilience4j.bulkhead.instances.api.max-wait-duration=1s

# ---------- Currency conversion (third-party API: Frankfurter, https://frankfurter.dev) ----------
# Currency our prices are stored in
shop.currency.base=USD
shop.currency.frankfurter.base-url=https://api.frankfurter.dev/v1
# Max time to open the connection to Frankfurter
shop.currency.frankfurter.connect-timeout=2s
# Max time to wait for Frankfurter's answer once connected
shop.currency.frankfurter.read-timeout=5s

# Retry: up to 3 attempts in total, 500ms apart - only for network problems/timeouts and 5xx errors
# (an unknown currency is NOT retried, it will never succeed)
resilience4j.retry.instances.currency.max-attempts=3
resilience4j.retry.instances.currency.wait-duration=500ms
resilience4j.retry.instances.currency.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Circuit breaker: if at least 50% of the last 10 calls failed, stop calling Frankfurter for 30s
# and answer 503 immediately. After 30s, let 2 test calls through to see if it has recovered.
resilience4j.circuitbreaker.instances.currency.sliding-window-size=10
resilience4j.circuitbreaker.instances.currency.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.currency.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.currency.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.currency.permitted-number-of-calls-in-half-open-state=2
# An unknown currency is the caller's mistake, not Frankfurter failing, so it doesn't count
resilience4j.circuitbreaker.instances.currency.ignore-exceptions=com.example.shop.exception.InvalidRequestException

# Own bulkhead: at most 10 calls to Frankfurter at the same time, so a slow Frankfurter
# can't use up all of the "api" bulkhead's 20 slots
resilience4j.bulkhead.instances.currency.max-concurrent-calls=10
resilience4j.bulkhead.instances.currency.max-wait-duration=500ms

# Show the request ID (set by RequestIdFilter) on every log line, e.g. "INFO [reqId=7f3a...]"
logging.pattern.level=%5p [reqId=%X{reqId:-}]

# Also write logs to a file (plain text, same format as the console), next to where the app is started
logging.file.name=logs/shop-api.log
# Start a new file every day (the %d part), or sooner when the file reaches 10MB (the %i part)
logging.logback.rollingpolicy.file-name-pattern=logs/shop-api-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
# Delete old files after 30 days, and never keep more than 1GB of old files in total
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# LoggingAspect: controller/service calls slower than this (in milliseconds) are logged as SLOW
shop.logging.slow-threshold-ms=500

# Tables are created only by our Flyway SQL scripts in src/main/resources/db/migration.
# "validate" means Hibernate only checks that the tables match our Java classes — it never changes them.
spring.jpa.hibernate.ddl-auto=validate

# Always return dates in UTC (e.g. "2026-10-18T19:16:49Z"), so every response looks the same
spring.jackson.time-zone=UTC

# Per-endpoint database timeouts (used by @Transactional(timeoutString = ...) in the services).
# If an endpoint's database work takes longer, the query is stopped and the caller gets 503.
# Max seconds of database work for read endpoints (GET)
shop.timeout.read-seconds=2
# Max seconds of database work for write endpoints (POST / PUT / DELETE, cancel, pay)
shop.timeout.write-seconds=5

# ---------- Kafka + outbox publisher (order events) ----------
# Message key = order ID, message value = the JSON payload from outbox_event (both plain text)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka must confirm the message is safely stored before we mark it PUBLISHED
spring.kafka.producer.acks=all
# Kafka drops duplicates caused by its own internal retries
spring.kafka.producer.properties.enable.idempotence=true
# Give up quickly when Kafka is down (default is 60 s); the outbox retries on the next round anyway
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# The publisher creates the topic itself before its first send (also works if Kafka was down at startup)
spring.kafka.admin.auto-create=false
spring.kafka.admin.operation-timeout=5s
spring.kafka.admin.properties.request.timeout.ms=5000
spring.kafka.admin.properties.default.api.timeout.ms=5000

# Topic for all order events (key = order ID, so one order's events stay in order)
shop.kafka.topic.order-events=order-events
shop.kafka.topic.order-events-partitions=3
# How often the publisher looks for NEW outbox rows (milliseconds, counted from the end of the last round)
shop.outbox.poll-interval-ms=1000
# Max rows sent per round
shop.outbox.batch-size=50
# Max seconds to wait for Kafka to confirm one message
shop.outbox.send-timeout-seconds=10
# Turn the publisher off (e.g. in tests) with false
shop.outbox.publisher.enabled=true
